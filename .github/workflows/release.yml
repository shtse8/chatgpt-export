name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example v2.1.3)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Test & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Preserve publication tooling from this workflow revision when rebuilding an older tag.
      - name: Retain store status checker
        run: cp scripts/chrome-webstore-status.mjs "$RUNNER_TEMP/chrome-webstore-status.mjs"

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build all formats
        run: bun run build

      - name: Create extension ZIP
        run: cd dist/extension && zip -r ../../chatgpt-export.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            chatgpt-export.zip
            dist/standalone/inject.js
            dist/userscript/chatgpt-export.user.js
            dist/bookmarklet/bookmarklet.txt
          generate_release_notes: true

      # Keep credentials in the environment; recent CLI releases reject secret flags.
      - name: Publish to Chrome Web Store
        if: env.EXTENSION_ID != ''
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: node "$RUNNER_TEMP/chrome-webstore-status.mjs" --publish
